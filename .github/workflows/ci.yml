name: NovaWallet CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests (quality gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore NovaWallet.slnx
      - name: Unit tests
        run: dotnet test tests/NovaWallet.UnitTests/NovaWallet.UnitTests.csproj --configuration Release --no-restore --logger "trx;LogFileName=unit-tests.trx"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: tests/NovaWallet.UnitTests/TestResults/*.trx

  build:
    name: Build (only after unit tests pass)
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore NovaWallet.slnx
      - name: Build
        run: dotnet build NovaWallet.slnx --configuration Release --no-restore

  integration-tests:
    name: SQL Server concurrency/integration tests
    needs: build
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Your_Strong_Password123!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -C"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore NovaWallet.slnx
      - name: Integration tests
        env:
          NOVAWALLET_TEST_CONNECTION: "Server=localhost,1433;Database=Novawallet;User Id=sa;Password=Your_Strong_Password123!;TrustServerCertificate=True;Encrypt=True"
        run: dotnet test tests/NovaWallet.IntegrationTests/NovaWallet.IntegrationTests.csproj --configuration Release --no-restore

  container-build:
    name: Container build
    needs: integration-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker images
        run: docker compose build
